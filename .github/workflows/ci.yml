name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# push では main と develop だけ、作業ブランチは pull_request でだけ走らせる（同じコミットで二重に走らない）。
# すべてのジョブはセルフホストの Linux ランナー（[self-hosted, Linux, X64]）で走らせる。
# Windows 向けの検査は GOOS=windows のクロスコンパイル（build と vet）だけで、Windows の実機は使わない。
# ツール（Go・bun・golangci-lint・templ）はランナーに入っている前提にせず、setup アクションで導入する（bun は ./.github/actions/setup-bun）。
# Go・bun のキャッシュはジョブ専用の一時領域（RUNNER_TEMP）に置き、ランナーのホームや他ジョブへ状態を残さない。
# Lit のテスト・Playwright の E2E は M2（Web UI）で足す。
# 配信（nightly.yml・release.yml。docs/operations/release.md）の検査として、installer ジョブでインストーラをビルドだけして
# （公開はしない）runner の道具の導入を確かめ、release-scripts ジョブで配信スクリプトのテストとワークフローの検査をする。
# release.yml は、この CI（name: CI）が main への push で成功したときに起動する。
jobs:
  go:
    name: go (linux)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Go のキャッシュをジョブ専用の領域にする
        run: |
          {
            echo "GOPATH=$RUNNER_TEMP/go"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt が必要なファイル:"
            echo "$out"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: import 規則 (domain は他の内部パッケージを import しない)
        run: ./scripts/check-imports.sh

      - name: go test
        run: go test -race ./...

  # Windows 向けのコード（//go:build windows）は、Linux でのクロスコンパイルの build と vet だけで検査する。
  # 実機の動作確認は docs/operations/smoke-windows.md の手順で行う（CI では行わない）。
  windows-cross:
    name: go (GOOS=windows build/vet)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7

      - name: Go のキャッシュをジョブ専用の領域にする
        run: |
          {
            echo "GOPATH=$RUNNER_TEMP/go"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: go build (GOOS=windows)
        run: go build ./...

      - name: go vet (GOOS=windows)
        run: go vet ./...

      - name: import 規則 (GOOS=windows)
        run: ./scripts/check-imports.sh

  # フロントエンド（HALT。docs/architecture/frontend.md §8・§9）: templ 生成物の差分チェック → フロントエンドのビルド →
  # 型検査 → 本番ビルド（static/dist を go:embed）と同梱物のテスト。ビルド成果物は OS に依存しない。
  frontend:
    name: frontend
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Go・bun のキャッシュをジョブ専用の領域にする
        run: |
          {
            echo "GOPATH=$RUNNER_TEMP/go"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/setup-bun

      - name: templ を導入（go.mod の版）
        run: go install "github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)"

      - name: templ generate の差分チェック
        run: |
          templ generate
          if [ -n "$(git status --porcelain -- '*_templ.go')" ]; then
            echo "_templ.go が .templ と一致していない。templ generate を実行してコミットすること:"
            git status --short -- '*_templ.go'
            git diff -- '*_templ.go' | head -100
            exit 1
          fi

      - name: 依存の導入（bun.lock のとおり）
        working-directory: static
        run: bun install --frozen-lockfile

      - name: フロントエンドのビルド（esbuild・Tailwind・htmx の同梱）
        working-directory: static
        run: bun run build

      - name: TypeScript の型検査
        working-directory: static
        run: bunx tsc -p .

      - name: go build (production。dist を go:embed)
        run: go build -tags production ./...

      - name: go build (production, GOOS=windows)
        run: go build -tags production ./...
        env:
          GOOS: windows
          GOARCH: amd64

      - name: 同梱した dist のテスト (production)
        run: go test -tags production ./static/...

  lint:
    name: lint
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Go・golangci-lint のキャッシュをジョブ専用の領域にする
        run: |
          {
            echo "GOPATH=$RUNNER_TEMP/go"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOLANGCI_LINT_CACHE=$RUNNER_TEMP/golangci-lint"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint を導入
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          skip-cache: true
          args: ./...

      - name: golangci-lint (GOOS=windows)
        run: golangci-lint run ./...
        env:
          GOOS: windows
          GOARCH: amd64

  # 配信のスクリプト（版・タグの決定、片付け、公開）のテストと、ワークフローの静的検査。
  release-scripts:
    name: release scripts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Go のキャッシュをジョブ専用の領域にする
        run: |
          {
            echo "GOPATH=$RUNNER_TEMP/go"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 配信スクリプトのテスト（偽のタグ・偽の gh。ネットワークなし）
        run: ./scripts/ci/test-release-scripts.sh

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

  # インストーラのビルドだけ（公開しない）。nightly.yml・release.yml と同じ composite action で作り、
  # runner での道具（task・wails3・makensis・gh）の導入が通ることを PR の段階で確かめる。
  installer:
    name: installer (build only)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 版を決める（VERSION ファイルの値。公開はしない）
        id: ver
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "app_version=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-installer
        id: build
        with:
          version: ${{ steps.ver.outputs.version }}
          app-version: ${{ steps.ver.outputs.app_version }}
          asset: puppet-remo-ci-amd64-installer.exe

      - name: gh を用意（公開ジョブと同じ手順）
        run: ./scripts/ci/install-gh.sh

      - name: gh の版
        run: gh --version
